<style>

    kid(ctx, dx, gy, S, COATS[4], HATS[4], { look: -1, aL: -2.5 * (1 - wind) - 0.3, aR: 0.4, step: 0 });
    var sbx = lerp(dx - 8 * S, cxk + 8 * S, q), sby = lerp(gy - 48 * S, gy - 44 * S, q) - Math.sin(Math.PI * q) * 70 * S;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(sbx, sby, 4.5 * S, 0, TAU); ctx.fill();
  }

  /* ---------- 360° panorama ---------- */
  var PW = 4096, PH = 1024, HOR = 600;
  function buildPano() {
    pano = document.createElement('canvas'); pano.width = PW; pano.height = PH;
    var c = pano.getContext('2d'), r = rng(7), i;
    function wrap(x, fn, m) { fn(x); if (x < m) fn(x + PW); if (x > PW - m) fn(x - PW); }
    var g = c.createLinearGradient(0, 0, 0, HOR); g.addColorStop(0, '#060d24'); g.addColorStop(0.5, '#27437a'); g.addColorStop(1, '#e6b5ab');
    c.fillStyle = g; c.fillRect(0, 0, PW, HOR + 2);
    for (i = 0; i < 520; i++) { c.fillStyle = 'rgba(255,255,255,' + (0.2 + r() * 0.7) + ')'; c.beginPath(); c.arc(r() * PW, r() * 430, 0.5 + r() * 1.3, 0, TAU); c.fill(); }
    var mg = c.createRadialGradient(1100, 190, 6, 1100, 190, 170); mg.addColorStop(0, 'rgba(255,248,225,0.55)'); mg.addColorStop(1, 'rgba(255,248,225,0)');
    c.fillStyle = mg; c.fillRect(900, 0, 400, 400); c.fillStyle = '#fff7df'; c.beginPath(); c.arc(1100, 190, 34, 0, TAU); c.fill();
    mountain(c, PW, PH, 520, 170, ridgeFn(PW, 11, [2, 3, 5, 7, 11, 17]), '#7089ba', '#3f5c94');
    mountain(c, PW, PH, 566, 105, ridgeFn(PW, 23, [3, 4, 7, 11, 16, 24]), '#456399', '#2d4a80');
    var gg = c.createLinearGradient(0, HOR, 0, PH); gg.addColorStop(0, '#d5e1f4'); gg.addColorStop(0.4, '#aebfdc'); gg.addColorStop(1, '#6f85b2');
    c.fillStyle = gg; c.fillRect(0, HOR, PW, PH - HOR);
    for (i = 0; i < 90; i++) {
      var tx = r() * PW, th = 70 + r() * 60;
      wrap(tx, function (x) { pine(c, x, HOR + 10, th, '#1f3d57', '#dfe9fa'); }, 100);
    }
    var hx = [300, 900, 1500, 2250, 2900, 3550];
    hx.forEach(function (x, k) {
      var s = 1.1 + (k % 3) * 0.2, y = 668 + (k % 2) * 14;
      wrap(x, function (xx) { house(c, xx, y, s, k % 2 ? '#2a3963' : '#33426f'); }, 200);
    });
    for (i = 0; i < 40; i++) {
      var ex = r() * PW, ey = 650 + r() * 330, ew = 90 + r() * 260, eh = 8 + r() * 22, lite = i % 3;
      wrap(ex, function (xx) { c.fillStyle = lite ? 'rgba(255,255,255,0.15)' : 'rgba(70,90,150,0.18)'; c.beginPath(); c.ellipse(xx, ey, ew, eh, 0, 0, TAU); c.fill(); }, 300);
    }
    for (i = 0; i < 42; i++) {
      var mxp = r() * PW, mth = 120 + r() * 60;
      wrap(mxp, function (x) { pine(c, x, 735 + (i % 4) * 8, mth, '#17323f', '#eaf1ff'); }, 120);
    }
    [180, 1300, 1800, 2700, 3100, 3800].forEach(function (x, k) {
      wrap(x, function (xx) {
        c.fillStyle = '#2b2f4a'; c.fillRect(xx - 3, 760 - k % 2 * 0, 6, 70);
        var lg = c.createRadialGradient(xx, 754, 2, xx, 754, 70); lg.addColorStop(0, 'rgba(255,214,130,0.8)'); lg.addColorStop(1, 'rgba(255,214,130,0)');
        c.fillStyle = lg; c.fillRect(xx - 80, 674, 160, 160); c.fillStyle = '#ffe3a0'; c.beginPath(); c.arc(xx, 756, 6, 0, TAU); c.fill();
      }, 100);
    });
    [650, 2048, 3350].forEach(function (x, k) {
      wrap(x, function (xx) { group(c, xx, 880 + k * 12, 2.0, k); }, 500);
    });
    [420, 1120, 1560, 2620, 3020, 3880].forEach(function (x, k) {
      wrap(x, function (xx) { pine(c, xx, 1012, 380 + (k % 3) * 40, '#122a36', '#f1f6ff'); }, 160);
    });
  }
  function group(c, x, y, s, k) {
    var sm = 1.15 * s;
    c.fillStyle = 'rgba(30,50,100,0.22)'; c.beginPath(); c.ellipse(x + 70 * s, y + 2 * s, 230 * s, 10 * s, 0, 0, TAU); c.fill();
    snowman(c, x, y, sm);
    kid(c, x - 48 * s, y, s, COATS[k % 5], HATS[k % 5], { look: 1, aR: 1.15, aL: -0.4 });
    kid(c, x + 66 * s, y, s, COATS[(k + 1) % 5], HATS[(k + 1) % 5], { look: -1, aL: -2.5, aR: 0.4, step: 0.3 });
    var bx = x + 150 * s, R = 21 * s;
    ball(c, bx, y - R, R, 1 + k);
    kid(c, bx + R + 17 * s, y, s, COATS[(k + 3) % 5], HATS[(k + 3) % 5], { look: -1, aL: -1.25, aR: -1.25, step: 0.6 });
  }

  /* ---------- qor ---------- */
  var flakes = [], MAXF = 460, density = 0.6;
  function newFlake(rand) {
    var z = Math.random();
    return { x: Math.random() * w, y: rand ? Math.random() * h : -10, z: z, r: 0.8 + z * z * 3.4, vy: 32 + z * 95, ph: Math.random() * TAU, dr: 10 + z * 22 };
  }
  function initFlakes() { flakes.length = 0; for (var i = 0; i < MAXF; i++) flakes.push(newFlake(true)); }
  function drawSnow(dt, t, shiftX) {
    var n = Math.floor(MAXF * (0.04 + 0.96 * density));
    ctx.fillStyle = '#fff';
    for (var i = 0; i < n; i++) {
      var f = flakes[i];
      f.y += f.vy * dt * (0.75 + density * 0.5);
      f.x += (Math.sin(t * 0.8 + f.ph) * f.dr + 16) * dt + shiftX * (0.35 + f.z);
      if (f.y > h + 10) { f.y = -10; f.x = Math.random() * w; }
      if (f.x > w + 10) f.x = -10; else if (f.x < -10) f.x = w + 10;
      ctx.globalAlpha = 0.3 + f.z * 0.65;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- panorama ko'rinishi ---------- */
  var yaw = 0, pitch = PH * 0.56, yawV = 0, auto = !rm, panoS = 1, drag = false, lx = 0, ly = 0, lt = 0;
  var VF = PH * 0.72;
  function geom() { var s = Math.max(h / VF, w / PW); return { s: s, visW: w / s, visH: h / s }; }
  function drawPano() {
    var G = geom(); panoS = G.s;
    pitch = Math.max(G.visH / 2, Math.min(PH - G.visH / 2, pitch));
    var y0 = ((yaw % PW) + PW) % PW, sy = pitch - G.visH / 2;
    var sw1 = Math.min(G.visW, PW - y0), dw1 = sw1 * G.s;
    ctx.drawImage(pano, y0, sy, sw1, G.visH, 0, 0, dw1, h);
    if (sw1 < G.visW) ctx.drawImage(pano, 0, sy, G.visW - sw1, G.visH, dw1, 0, w - dw1, h);
    return ((y0 + G.visW / 2) / PW * 360) % 360;
  }
  var DIRS = ['Shimol', 'Shimoli-sharq', 'Sharq', 'Janubi-sharq', 'Janub', 'Janubi-g‘arb', 'G‘arb', 'Shimoli-g‘arb'];
  var degNum = document.getElementById('degNum'), degDir = document.getElementById('degDir'), lastDeg = -1;

  cv.addEventListener('pointerdown', function (e) {
    if (mode !== 'pano') return;
    drag = true; lx = e.clientX; ly = e.clientY; lt = performance.now(); yawV = 0; cv.classList.add('grab');
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var now = performance.now(), dx = e.clientX - lx, dy = e.clientY - ly, dtm = Math.max(8, now - lt) / 1000;
    yaw -= dx / panoS; pitch -= dy / panoS;
    yawV = Math.max(-2500, Math.min(2500, -dx / panoS / dtm)) * 0.6 + yawV * 0.4;
    lx = e.clientX; ly = e.clientY; lt = now; pendingShift = dx;
  });
  function endDrag() { if (!drag) return; drag = false; cv.classList.remove('grab'); if (performance.now() - lt > 90) yawV = 0; }
  cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
  window.addEventListener('keydown', function (e) {
    if (mode !== 'pano') return;
    if (e.key === 'ArrowLeft') yawV -= 500; else if (e.key === 'ArrowRight') yawV += 500;
  });
  var pendingShift = 0;

  /* ---------- rejimlarni almashtirish ---------- */
  var veil = document.getElementById('veil'), hero = document.getElementById('hero'), hud = document.getElementById('hud'), hint = document.getElementById('hint');
  var autoBtn = document.getElementById('auto'), toggleLabel = document.getElementById('toggleLabel');
  function applyMode(m) {
    mode = m;
    document.body.classList.toggle('is-pano', m === 'pano');
    cv.classList.toggle('pano', m === 'pano');
    hero.hidden = m === 'pano'; hud.hidden = m !== 'pano'; hint.hidden = m !== 'pano'; autoBtn.hidden = m !== 'pano';
    toggleLabel.textContent = m === 'pano' ? 'Bosh sahifa' : '360° ko‘rinish';
    if (m === 'pano') {
      if (!pano) buildPano();
      var G = geom(); yaw = 2048 - G.visW / 2; pitch = PH * 0.56; yawV = 0;
    }
    try { history.replaceState(null, '', m === 'pano' ? '#360' : location.pathname + location.search); } catch (e) {}
  }
  function go(m) {
    if (m === mode) return;
    veil.classList.add('on');
    setTimeout(function () { applyMode(m); veil.classList.remove('on'); }, rm ? 0 : 230);
  }
  document.getElementById('toggleView').addEventListener('click', function () { go(mode === 'home' ? 'pano' : 'home'); });
  document.getElementById('brand').addEventListener('click', function () { go('home'); });
  autoBtn.addEventListener('click', function () { auto = !auto; autoBtn.textContent = 'Avto-aylanish: ' + (auto ? 'yoqilgan' : 'o‘chiq'); });
  document.getElementById('snow').addEventListener('input', function (e) { density = e.target.value / 100; });
  autoBtn.textContent = 'Avto-aylanish: ' + (auto ? 'yoqilgan' : 'o‘chiq');

  /* ---------- asosiy sikl ---------- */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); w = window.innerWidth; h = window.innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(0.8, Math.min(w / 520, h / 600));
    buildHome();
    if (!flakes.length) initFlakes();
  }
  window.addEventListener('resize', resize);
  resize();

  var T = 0, prev = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    if (rm) dt *= 0.3;
    T += dt;
    var shift = 0;
    if (mode === 'home') {
      drawHome(T);
    } else {
      if (!drag) {
        var before = yaw;
        yaw += yawV * dt; yawV *= Math.pow(0.04, dt); 
        if (auto && Math.abs(yawV) < 40) yaw += 68 * dt;
        shift = -(yaw - before) * panoS;
      } else { shift = pendingShift; pendingShift = 0; }
      var deg = drawPano(), d = Math.round(deg);
      if (d !== lastDeg) { lastDeg = d; degNum.textContent = d + '°'; degDir.textContent = DIRS[Math.round(deg / 45) % 8]; }
    }
    drawSnow(dt, T, shift);
    requestAnimationFrame(frame);
  }
  if (location.hash === '#360') applyMode('pano');
  requestAnimationFrame(function (t) { prev = t; frame(t); });
  setTimeout(function () { if (!pano) buildPano(); }, 600); 
})();
</script>
